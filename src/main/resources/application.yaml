spring:
  application:
    name: Diaz-Capital-Group


  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prueba}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}


  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false


server:
  port: ${SERVE_PORT:8080}